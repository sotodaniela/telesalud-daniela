version: '3.8'

services:
  telehealth-db:
    image: mysql:8.0
    container_name: telehealth-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: telehealth
      MYSQL_USER: telehealth
      MYSQL_PASSWORD: telehealth123
    volumes:
      - telehealth-db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - telehealth-network
    restart: unless-stopped

  telehealth-app:
    build: .
    container_name: telehealth-app
    ports:
      - "8090:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - telehealth-db
    networks:
      - telehealth-network
    restart: unless-stopped

networks:
  telehealth-network:
    driver: bridge

volumes:
  telehealth-db-data:
